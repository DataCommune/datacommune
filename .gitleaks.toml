# Gitleaks configuration — DataCommune (SEC-01 / threat T46-03-LEAK)
#
# Scope: the security-audit workflow scans the WORKING TREE and the PR/push
# COMMIT RANGE only (never the full history — the pre-public history purge of
# dead `dc_live_` keys is tracked separately as DA-08).
#
# Fail-closed: any non-allowlisted finding fails the job. Output is `--redact`ed;
# reports expose file / rule / count only, never the matched string.
#
# INVARIANT: this file MUST NOT contain any secret value. Entries below carry a
# rule/path, a revoked/false-positive/by-design status and a triage date only.

title = "DataCommune gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Triaged historical (revoked) and by-design (public) findings. No secret value stored."

# --- Path-scoped allowlist (documentation / vendored trees) ------------------
paths = [
  # Revoked dead demo API key committed in a FROZEN v2.2 archive plan.
  # Rule: generic-api-key. Status: REVOKED (dead `dc_live_` demo key).
  # Triaged: 2026-07-22. Full-history purge deferred to pre-public (DA-08).
  '''\.planning/archive/admin-v2\.2/phases/06-cleanup-grid-foundation/06-04-PLAN\.md''',
  # Planning + review docs: prose and placeholder keys (dc_live_xxx, sk_live_xxx).
  # Documentation, not source; no live secret. Status: FALSE-POSITIVE. 2026-07-22.
  # Scoped to documentation extensions only, so a non-doc file (a stray .env,
  # .key, source file) dropped under these trees is NOT silently allowlisted.
  '''\.planning/.*\.md$''',
  '''reviews/.*\.(md|err|log|txt|json)$''',
  # Design mockups + API usage docs + guides: prose and placeholder curl examples
  # (`curl -H "X-API-Key: VOTRE_CLE"`). rule: curl-auth-header / generic-api-key.
  # Documentation, not runtime source; no live secret. FALSE-POSITIVE. 2026-07-22.
  # Scoped to documentation extensions only (a stray .env/.key/source file dropped
  # under these trees is NOT silently allowlisted).
  '''\.planning/design/.*\.dc\.html$''',
  '''api/docs/.*\.md$''',
  '''frontend/src/routes/\(marketing\)/guides/.*\.svx$''',
  # Named example-catalog files whose whole purpose is to render curl API examples
  # with a `VOTRE_CLE` placeholder. rule: curl-auth-header. FALSE-POSITIVE. 2026-07-22.
  # Whole-file scope is accepted here: a real secret added to *these two named files*
  # later would escape gitleaks, but the specific dc_live_/sk_live_/etc. default rules
  # still apply everywhere else. Re-triage if either file gains non-example content.
  '''frontend/src/lib/data/marketing-datasets\.ts$''',
  '''frontend/src/routes/\(marketing\)/playground/\+page\.svelte$''',
  # Vendored / generated trees (not tracked; defense-in-depth if ever scanned).
  '''(^|/)node_modules/''',
  '''(^|/)\.venv(-release)?/''',
  '''(^|/)\.svelte-kit/''',
]

# --- Pattern-scoped allowlist (public-by-design identifiers) ------------------
regexes = [
  # Anonymous frontend key prefix. Public by design (embedded in the shipped
  # bundle, quota-capped server-side per SEC-02). NOT a secret. Status: BY-DESIGN.
  # Triaged: 2026-07-22. This is a prefix pattern, not a secret value.
  '''dc_anon_[A-Za-z0-9_-]*''',
  # Deliberate fake sentinel used by redaction tests to PROVE secrets are scrubbed
  # (test_phase44_live_evidence.py, test_exact_resolution_report.py). rule:
  # generic-api-key. Not a real credential. Status: BY-DESIGN (test fixture). 2026-07-22.
  '''dc_live_SENTINEL[0-9a-fA-F]+''',
]

