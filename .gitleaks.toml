# 2026-09-20 (plan 01-02) : empreinte de contenu dans le manifeste `artifacts_sha256`
# de l'audit de recentrage, transféré depuis `9d903a46` comme spécification de phase 4.
# Faux positif PROUVÉ, pas supposé : les 18 valeurs de cet objet sont des hex-64 et
# 17 d'entre elles sont exactement le SHA-256 du fichier qu'elles nomment à la révision
# `9002f0e7` de l'ancien dépôt (la 18e, `socle/source-references.json`, correspond au
# fichier tel que transféré ici). Ce n'est donc pas une clé d'API mais l'empreinte de
# `docs/audit-recentrage-2026-09-10/socle-api-revue.md`. Portée : un chemin, une règle,
# une valeur exacte — une empreinte modifiée exige un nouveau triage.
[[allowlists]]
description = "Reviewed audit-recentrage artifacts_sha256 document fingerprint"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^docs[\/]audit\-recentrage\-2026\-09\-10[\/]socle[\/]verification\.json$''']
regexes = ['''^socle\-api\-revue\.md":\ "5613d2e03f55bb3a892f0c36dcfabd2cd750f18207b2224a1ae2b94ec000ee52"$''']

# 2026-10-06 : `const TOKEN` du test de redirection `/bien/[token]` (04-08) est le
# jeton d'adresse en clair d'une fixture (« 12 rue des lilas 85000 la roche sur
# yon » en slug), pas une clé d'API. Faux positif PROUVÉ : la valeur est lisible et
# égale au libellé de la ligne suivante. Portée : un chemin, une règle, une valeur
# exacte — une autre valeur dans ce fichier reste détectée.
[[allowlists]]
description = "Plain-text address slug fixture of the /bien/[token] redirect test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^frontend[\/]src[\/]routes[\/]\(marketing\)[\/]bien[\/]\[token\][\/]load\.test\.ts$''']
regexes = ['''^12\-rue\-des\-lilas\-85000\-la\-roche\-sur\-yon$''']

