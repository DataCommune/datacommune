[defaults]
# Default inventory — override with -i or ANSIBLE_INVENTORY if needed
inventory          = inventory/vps-demo.yml

# Disable host key checking for first connection (VPS provisioning one-shot).
# Re-enable after first run by setting to True or removing this line.
host_key_checking  = False

# Vault password is NEVER stored in this file.
# Pass it at run time via:
#   ansible-playbook site.yml --vault-password-file ~/.secrets/vault-pass
# Or export the env var:
#   export ANSIBLE_VAULT_PASSWORD_FILE=~/.secrets/vault-pass
# vault_password_file = <DO NOT UNCOMMENT — pass at CLI or via env var>

# Roles and collections (all tasks use ansible.builtin.* only — no external roles)
roles_path = roles

# Human-readable output format
stdout_callback = ansible.builtin.default
result_format = yaml

# Increase timeout for slow package operations (apt, docker image pulls)
timeout = 60

[privilege_escalation]
# Default: no privilege escalation assumed.
# The inventory sets become=true for the vps-demo host (root or sudo user).
become      = False
become_method = sudo

[ssh_connection]
# SSH control multiplexing for faster repeated task runs
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o StrictHostKeyChecking=no
pipelining = True
