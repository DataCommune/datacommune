# Drop-in scoped to the synthetic-probe instance only (46-01, T6).
#
# The synthetic probe already alerts at the application level on any invariant
# regression. This OnFailure adds an OS-level safety net: if the unit itself
# exits non-zero (docker exec fails, the module fails to import, the process is
# killed) the probe's in-process Apprise call never runs, so systemd fires an
# independent alert unit instead. Scoped via a per-instance drop-in so the
# shared datacommune-job@.service template (ETL, heartbeat, ...) is untouched.

[Unit]
OnFailure=datacommune-job-alert@synthetic-probe.service
