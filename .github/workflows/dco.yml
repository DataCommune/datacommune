name: DCO

# Developer Certificate of Origin (D-136, CONTRIBUTING.md): every commit of a pull request to the
# public repository carries a `Signed-off-by:` line. The job runs only in DataCommune/datacommune
# (skipped in the private working repository) and only on `pull_request`, which gives a fork a
# read-only token and no secret; no third-party action, no runner of our own. The two SHAs reach
# the script through environment variables, never by interpolation into it.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    if: github.repository == 'DataCommune/datacommune'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit of the pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-signed-off.sh "$BASE_SHA" "$HEAD_SHA"
