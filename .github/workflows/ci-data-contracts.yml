  recovery-image:
    needs: [resource-ownership, offline-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # test_l11_recovery_image.py refuses to restore with less than 10 GB free
      # in its pytest tmp dir, and ubuntu-latest leaves 9.9-10.0 GB once the
      # image is built: the job failed on that margin alone (runs 38248006422,
      # 38281713777, 39661032124, 39663854668). This job uses uv, docker and a
      # self-contained pwsh only, so the preinstalled .NET, Android, Haskell and
      # CodeQL trees can go; pwsh is called once after the removal so a broken
      # shell fails here, under its own name, instead of inside the restore.
      - name: Free runner disk space for the restore
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked --group dev
      - name: Build the candidate recovery image by immutable ID
        id: build_recovery_image
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker compose version
          image_record="$RUNNER_TEMP/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.iid"
          docker build --iidfile "$image_record" -f api/docker/Dockerfile api/backend
          image_id=$(docker image inspect --format '{{.Id}}' "$(cat "$image_record")")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Restore and recover through the candidate image
        id: recovery
        shell: pwsh
        env:
          L11_RECOVERY_IMAGE: ${{ steps.build_recovery_image.outputs.image_id }}
          L11_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/l11-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        # The existing wrapper owns its loopback PostGIS and tears it down.
        # No incoming DATABASE_URL or production environment is accepted.
        run: >-
          ./scripts/run_contract_integration.ps1
          tests/integration/test_l11_recovery_image.py
          "--junitxml=$env:L11_RECOVERY_EVIDENCE_DIR/recovery.xml"
          --tb=short
      - name: Preserve only the successful current-run recovery proof
        if: ${{ success() && steps.recovery.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-image-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/l11-recovery-${{ github.run_id }}-${{ github.run_attempt }}/verification.json
            ${{ runner.temp }}/l11-recovery-${{ github.run_id }}-${{ github.run_attempt }}/recovery.xml

  required-contracts:
    if: ${{ always() }}
    needs: [resource-ownership, offline-backend, offline-frontend, audit-artifacts, postgis-integration, recovery-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every contract job on this candidate
        shell: bash
        run: |
          for result in "${{ needs.resource-ownership.result }}" "${{ needs.offline-backend.result }}" "${{ needs.offline-frontend.result }}" "${{ needs.audit-artifacts.result }}" "${{ needs.postgis-integration.result }}" "${{ needs.recovery-image.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required contract job did not succeed: $result"
              exit 1
            fi
          done
