name: CI Data Contracts

# Runner: `ubuntu-latest`, GitHub-hosted. The private runner on the hypervisor is
# stopped and is not coming back -- plan 01-07 ported every kept workflow off it
# (REPO-04; D-13: the hypervisor is not the test machine). A runner you host yourself is
# also what must never survive a repository going public: any fork could then
# execute arbitrary code on it through a pull request. No workflow here names a
# private runner label, deliberately -- `docs/REPO-STATE.md` holds the history.
#
# Cost, since this repository is PRIVATE: runs bill the account's 2 000 free
# monthly minutes -- about 60 to 70 per push across the five kept workflows.
# `timeout-minutes` on every job plus the concurrency group below bound that
# budget; D-15 (one active lot, no commit storms) is what makes it sufficient.
#
# `docker` and `pwsh` are preinstalled on `ubuntu-latest`, so the disposable
# PostGIS harness runs the same command developers run locally. Returning to a
# local runner is one `runs-on:` line.

# Phase 43 (contrats semantiques & golden cases) gate: offline suites run
# first (backend pytest + frontend vitest, no DB/network), then the
# disposable PostGIS harness from Plan 43-01 reuses the same local command
# (scripts/run_contract_integration.ps1) that developers run locally. No
# live secret, no protected environment — everything here is either fully
# offline or a fresh throwaway container destroyed at the end of the job.

on:
  push:
    branches: [master]
    # Skip a push that only touches docs/ or the internal tracking: 7 of 27 pushes from
    # 2026-09-24 to 2026-10-22 re-ran the whole CI for prose. Patterns apply in
    # order, the last match decides: everything (dotfiles named explicitly,
    # since GitHub does not document whether `**` matches them), minus the two
    # prose trees, plus back the files tests read there -- the docs/ fixtures
    # and the V1 key list of tests/integration/test_route_scope_conformity.py.
    # Every source still reaches the PostGIS gate (test_stabilisation_ci_gate.py).
    paths:
      - "**"
      - "**/.*"
      - ".github/**"
      - "!docs/**"
      - "!.planning/**"
      - "docs/audit-stabilisation-2026-09-08/**"
      - ".planning/phases/02-donnees-reparees-rejouables/02-DATASETS.md"
  pull_request:
    paths:
      - "api/backend/**"
      - "api/docker/Dockerfile"
      - "docs/audit-stabilisation-2026-09-08/lot-11/recovery/probe.py"
      - "docs/audit-stabilisation-2026-09-08/lot-02/cor06-sources/**"
      - "docs/audit-stabilisation-2026-09-08/lot-08/mrr-api-fixture.json"
      - "contracts/fiche-fields.v1.json"
      - "contracts/golden-cases/v1/manifest.json"
      - "contracts/golden-cases/v1/schema.json"
      - "api/backend/app/common/fiche-fields.v1.json"
      - "api/backend/app/etl_fiscalite/pipeline.py"
      - "api/backend/app/etl_dpe/**"
      - "api/backend/app/dpe/**"
      - "api/backend/app/commune/**"
      - "api/backend/app/resolve/multi.py"
      - "api/backend/migrations/versions/091_dpe_source_lifecycle.py"
      - "api/backend/app/logements/queries.py"
      - "api/backend/migrations/versions/073_semantic_contracts.py"
      - "api/backend/scripts/preflight_semantic_contracts.py"
      - "api/backend/scripts/select_golden_cases.py"
      - "api/backend/scripts/sync_semantic_contract.py"
      - "api/backend/scripts/verify_golden_cases.py"
      - "api/backend/tests/etl/**"
      - "api/backend/tests/conftest.py"
      - "api/backend/tests/test_offline_database_guard.py"
      - "api/backend/tests/test_recovery_resource_ownership.py"
      - "api/backend/tests/test_resource_owner_contract.py"
      - "api/backend/tests/test_semantic_contract.py"
      - "api/backend/tests/test_golden_cases_contract.py"
      - "api/backend/tests/integration/**"
      # test_public_national_reset.py plays these SQL files and reads the table and
      # role lists of public-db-restore.sh.
      - "infra/public/*.sql"
      - "infra/public/public-db-restore.sh"
      # test_accounts_backup_restore.py reads the table list of accounts-dump.sh.
      - "infra/public/accounts-dump.sh"
      # test_purge_unverified_accounts.py plays the purge script on a migrated base.
      - "api/backend/scripts/purge_unverified_accounts.py"
      - "api/docker-compose.contract-tests.yml"
      - "api/backend/scripts/run_contract_integration.ps1"
      # Invocation ownership is shared by the DB harness and local web runners.
      - "scripts/test-*.ps1"
      - "scripts/start-test-web.ps1"
      - "scripts/stop-resources.ps1"
      - "scripts/serve-recette.ps1"
      - "scripts/tests/**"
      - "frontend/playwright*.ts"
      - "frontend/tests/e2e/fixtures/ports.ts"
      - "frontend/tests/e2e/fixtures/dpe-source-server.ts"
      - "frontend/src/lib/data/__fixtures__/golden-cases.ts"
      - "frontend/src/lib/data/semantic-contract.test.ts"
      - "frontend/src/lib/data/golden-cases.test.ts"
      - "frontend/src/lib/data/fiche-fields.v1.json"
      - ".github/workflows/ci-data-contracts.yml"

concurrency:
  # A superseded run proves nothing about the new head, so cancel it: a rush of
  # commits then costs one run instead of one per push. The 19/08 spike on the
  # old account burned 773 min (39% of a monthly quota) exactly this way. Never
  # cancel on master -- `master` is the only branch here (strategy `none`), so
  # in practice every run completes and the cap is `timeout-minutes`.
  group: ci-data-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  resource-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Every Docker/process/network command is intercepted by the test workers.
      # This checks the same ownership scripts without starting any service.
      - name: Verify invocation ownership with intercepted commands
        shell: pwsh
        run: ./scripts/tests/test-resource-isolation.ps1
      - name: Preserve ownership simulation results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: reports/reliability-lot0/

  offline-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked --group dev
      - run: uv run python -m scripts.sync_semantic_contract --check
      - run: >-
          uv run pytest
          tests/etl/test_fiscalite_transform.py
          tests/etl/test_checkpoint.py
          tests/etl/test_runner.py
          tests/etl/test_resume_contract.py
          tests/etl/test_dpe_archive_generation.py
          tests/test_semantic_contract.py
          tests/test_golden_cases_contract.py
          tests/test_stabilisation_ci_gate.py
          tests/test_recovery_image_ci_contract.py
          tests/test_resource_owner_contract.py
          tests/test_offline_database_guard.py
          tests/test_recovery_resource_ownership.py
          tests/test_commune_indicator_activation_wiring.py
          tests/test_commune_indicator_adoption.py
          tests/test_commune_indicator_evidence.py
          tests/test_commune_indicator_real_comparison.py
          tests/test_commune_indicator_policy.py
          tests/test_commune_indicator_query_wiring.py
          -v --tb=short
        env:
          DEBUG: "true"

  offline-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: >-
          npx vitest run
          src/lib/data/semantic-contract.test.ts
          src/lib/data/golden-cases.test.ts

  # CR-02 (Phase 48 review): the generated artifacts produced under the anti-PII
  # constraint had no automatic trigger at all — a hand-edit reintroducing a real
  # address, a coordinate or a cadastral reference would merge without any scanner
  # running. This job scans both of them: the golden manifest and the frontend
  # golden fixture. (A third one, the landing's public snapshot, was removed with
  # the landing in plan 03-05, D-38, together with its two validators.)
  # Secret-free by construction: the --audit-artifacts-only mode of
  # verify_golden_cases.py is fully offline (no DSN, no key, no network) and
  # refuses every live option itself. No `needs:` on purpose — this is a leak
  # gate, it must run even when another suite fails.
  audit-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked --group dev
      - run: >-
          uv run python scripts/verify_golden_cases.py
          --audit-artifacts-only
          --manifest ../../contracts/golden-cases/v1/manifest.json
          --frontend-fixture ../../frontend/src/lib/data/__fixtures__/golden-cases.ts

  postgis-integration:
    needs: [resource-ownership, offline-backend, offline-frontend]
    runs-on: ubuntu-latest
    # 45, not 30: this job provisions a disposable PostGIS container and replays
    # 46 integration files plus two golden SQL probes through it. Measured at
    # ~20 min locally; the extra margin covers a cold image pull on the runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # test_migration_100_rollback.py extracts the previous deployed SHA
          # (git archive) to run the old application: full history needed.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked --group dev
      # Same local command developers run (scripts/run_contract_integration.ps1,
      # Phase 43-01): provisions a disposable PostGIS container, runs the given
      # test paths, and always tears the container down afterwards.
      #
      # test_rnb_liens_elargissement.py guards the "widening unit is the
      # BUILDING, never the parcel" doctrine (Guerande regression, 2026-08-04).
      # It only holds against a real PostgreSQL: the partition is decided by
      # TEXT[] containment inside the SQL, so a fabricated result set would
      # merely replay the rows the test wrote itself. Keep it listed here --
      # ci-api.yml ignores tests/integration entirely.
      #
      # This list is reconciled against the tests/integration/ directory by
      # tests/test_integration_collection_contract.py (run by ci-api.yml): a
      # file added there but missing here turns CI red on the same push.
      # test_ban_rep_ordering.py guards the resolve repetition ranking
      # (2026-08-07 measurement: 9/14 corpus repetitions got a wrong ban_id):
      # the tiebreak lives in the SQL ORDER BY, only a real PostGIS can tie
      # word_similarity scores and break them on `rep`.
      - shell: pwsh
        run: >-
          ./scripts/run_contract_integration.ps1
          tests/integration/test_postgis_harness.py
          tests/integration/test_cadastre_makevalid.py
          tests/integration/test_recovery_partial_start.py
