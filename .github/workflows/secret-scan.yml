name: Secret Scan

# Runner: `ubuntu-latest`, GitHub-hosted. The private runner on the hypervisor is
# stopped and is not coming back -- plan 01-07 ported every kept workflow off it
# (REPO-04; D-13: the hypervisor is not the test machine). A runner you host yourself is
# also what must never survive a repository going public: any fork could then
# execute arbitrary code on it through a pull request. No workflow here names a
# private runner label, deliberately -- `docs/REPO-STATE.md` holds the history.
#
# Cost, since this repository is PRIVATE: runs bill the account's 2 000 free
# monthly minutes -- about 60 to 70 per push across the five kept workflows.
# `timeout-minutes` on every job plus the concurrency group below bound that
# budget; D-15 (one active lot, no commit storms) is what makes it sufficient.
#
# `docker` and `pwsh` are preinstalled on `ubuntu-latest`, so the disposable
# PostGIS harness runs the same command developers run locally. Returning to a
# local runner is one `runs-on:` line.

# Repo secret scan (threat T46-03-LEAK), split out from the dependency audit so
# it runs on EVERY push/PR regardless of which files changed. A secret can be
# introduced in ANY file (frontend/src, api/backend/app, infra, ...), so this
# workflow deliberately carries NO `paths:` filter — scoping it would let a
# credential added outside the manifest set slip through unscanned.
#
# Fail-closed: pinned + checksum-verified gitleaks binary; gitleaks fails
# unconditionally on any non-allowlisted finding, --redacted (file/rule/count
# only, never the matched value).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks, redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          set -euo pipefail
          ver="8.29.1"
          asset="gitleaks_${ver}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          curl -fsSL -o "$asset" "$base/${asset}"
          # Verify against the upstream-published checksums for this exact tag.
          curl -fsSL -o gitleaks_checksums.txt "$base/gitleaks_${ver}_checksums.txt"
          grep " ${asset}\$" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # An evidence-replay step sat here until plan 01-07: it re-injected known
      # credentials from the audit fixtures to prove the .gitleaks.toml
      # allowlists still bite. It ran a helper under `tools/`, which was not
      # transferred, against evidence files this repository does not hold
      # either, so it was removed with its inputs rather than stubbed. Nothing
      # replaces that proof today -- the allowlists are reviewed by hand, one
      # path + one rule + one exact value per entry (README, "Secret scan").
      # Named in docs/KNOWN-ISSUES.md, not silently dropped.

      - name: Determine scan range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            # First push to a new branch: before is all-zeros -> scan HEAD only.
            if [ -z "$before" ] || echo "$before" | grep -Eq '^0+$'; then
              if git rev-parse -q --verify "${{ github.sha }}~1" >/dev/null; then
                echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
              else
                # Root commit (first push of a one-commit repository): `sha~1`
                # does not exist and the range would read nothing.
                echo "range=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "range=${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan working tree (redacted, fail-closed)
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --no-banner \
            --report-format json \
            --report-path gitleaks-worktree.json

      # gitleaks exits 0 with "0 commits scanned" when the git log it reads is
      # empty or fails. The wrapper refuses that; its test proves the refusal
      # with the gitleaks binary installed above.
      - name: Test the zero-commit guard
        run: bash scripts/tests/test-secret-scan-commits.sh

      # The export guard against the real data the address fixtures were captured from
      # (scripts/check-real-data.py): its list is private, its test uses invented values.
      - name: Test the real-data export guard
        run: bash scripts/tests/test-check-real-data.sh

      # The publication circuit of the two repositories (D-135): export --parent,
      # publish-branch.sh and the parity check, on throwaway local repositories.
      - name: Test the publication circuit
        run: bash scripts/tests/test-publish-cycle.sh

      # The DCO check of dco.yml (public pull requests), on a throwaway repository.
      - name: Test the DCO check
        run: bash scripts/tests/test-check-signed-off.sh

      - name: Scan PR/push commits (redacted, fail-closed, refuses 0 commits scanned)
        run: |
          set -euo pipefail
          bash scripts/secret-scan-commits.sh \
            --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.range }}" \
            --report-format json \
            --report-path gitleaks-commits.json
